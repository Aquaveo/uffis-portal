{% extends "tethys_apps/app_library.html" %}

{% comment %}
Extends the stock library so app discovery, tag search and the configured/unconfigured split stay
upstream. Only the surface is ours.
{% endcomment %}

{% block styles %}
  {{ block.super }}
  {% include "uffis/_palette.html" %}
  <style id="uffis-apps">
    body { background: var(--page); color: var(--ink); }
    .site-header #header-navbar { background-color: var(--brand) !important; }
    .site-footer { background-color: var(--brand); }

    .app-libary-wrapper { padding-top: clamp(2rem, 5vw, 3.5rem); }
    .app-libary-wrapper > .container-xl:first-of-type { max-width: 68rem; }

    .app-container .app-title,
    .app-container h2 { font-size: var(--step-1); font-weight: 650; letter-spacing: -.01em; }

    .app-container {
      border: 1px solid var(--line); border-radius: 6px;
      background: var(--surface);
      transition: border-color .25s var(--ease), box-shadow .25s var(--ease);
    }
    .app-container:hover {
      border-color: var(--brand);
      box-shadow: 0 12px 28px -20px color-mix(in oklch, var(--brand) 70%, transparent);
    }
    .app-container:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

    .tag-search-field + .select2-container .select2-selection {
      border: 1px solid var(--line); border-radius: 4px; background: var(--surface);
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice {
      border: 1px solid var(--brand);
      background: var(--brand-wash);
      color: var(--ink);
      font-weight: 600;
    }
    @media (prefers-reduced-motion: reduce) { .app-container { transition: none; } }
  </style>
{% endblock %}
