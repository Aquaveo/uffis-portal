{% extends "tethys_portal/accounts/base.html" %}

{% comment %}
Shadows the stock change password page so its three fields carry labels. The form declares them
with label="", so the stock page renders empty <label> elements and leaves every input without an
accessible name.
{% endcomment %}

{% load django_bootstrap5 %}

{% block title %}{{ block.super }} - Change Password{% endblock %}

{% block account_form_title %}Change Password{% endblock %}

{% block account_form_body %}
  <form role="form" method="post">
    {% csrf_token %}
    {% bootstrap_field form.old_password label="Current password" %}
    {% bootstrap_field form.new_password1 label="New password" %}
    {% bootstrap_field form.new_password2 label="Confirm new password" %}
    <a href="{% url 'user:settings' %}" class="btn btn-outline-secondary">Cancel</a>
    <button type="submit" id="change-password-submit" class="btn btn-primary" name="change-password-submit">Save</button>
  </form>
{% endblock %}
