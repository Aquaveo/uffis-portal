name: tofu deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan (preview) or apply (make changes)"
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      image_tag:
        description: "Image tag to deploy, e.g. uffis-a1b2c3d"
        required: true
        type: string
      iac_ref:
        description: "Aquaveo/tethys-ecs-iac ref. Must be a full 40 character sha, checkout cannot resolve a short one."
        required: false
        default: c998662452650b59c36a18e4eecde86bdde47deb
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  tofu:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout this repo (tfvars + backend)
        uses: actions/checkout@v4

      - name: Checkout the general IaC module
        uses: actions/checkout@v4
        with:
          repository: Aquaveo/tethys-ecs-iac
          ref: ${{ inputs.iac_ref }}
          path: iac

      - name: Render tofu inputs
        env:
          STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          VPC_ID: ${{ vars.VPC_ID }}
          SUBNET_IDS: ${{ vars.SUBNET_IDS }}
          ACM_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
          DB_HOST: ${{ vars.DB_HOST }}
          PORTAL_DOMAIN: ${{ vars.PORTAL_DOMAIN }}
          SES_SMTP_USER: ${{ vars.SES_SMTP_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          for v in STATE_BUCKET ACCOUNT_ID VPC_ID SUBNET_IDS ACM_ARN DB_HOST PORTAL_DOMAIN SES_SMTP_USER IMAGE_TAG; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is not set"; exit 1; }
          done
          cat > tofu/backend.hcl <<EOF
          bucket = "${STATE_BUCKET}"
          region = "${{ vars.AWS_REGION }}"
          key    = "portals/uffis-portal.tfstate"
          EOF
          sed -e "s|__ACCOUNT_ID__|${ACCOUNT_ID}|g" \
              -e "s|__VPC_ID__|${VPC_ID}|g" \
              -e "s|__SUBNET_IDS__|${SUBNET_IDS}|g" \
              -e "s|__ACM_ARN__|${ACM_ARN}|g" \
              -e "s|__DB_HOST__|${DB_HOST}|g" \
              -e "s|__PORTAL_DOMAIN__|${PORTAL_DOMAIN}|g" \
              -e "s|__SES_SMTP_USER__|${SES_SMTP_USER}|g" \
              -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g" \
              tofu/uffis.tfvars.example > tofu/uffis.tfvars
          grep -q "__" tofu/uffis.tfvars && { echo "::error::unsubstituted token in tofu/uffis.tfvars"; exit 1; } || true

      - name: Preflight
        run: |
          set -euo pipefail
          for v in portal_domain_aliases iam_permissions_boundary email_host restrict_alb_to_cloudfront edge_proto_header; do
            grep -q "variable \"$v\"" iac/tofu/variables.tf || {
              echo "::error::iac module at this ref does not declare $v; the tfvars value would be silently dropped"
              exit 1
            }
          done

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.3"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: tofu init
        working-directory: iac/tofu
        run: tofu init -input=false -backend-config="${GITHUB_WORKSPACE}/tofu/backend.hcl"

      - name: tofu plan
        working-directory: iac/tofu
        run: tofu plan -input=false -var-file="${GITHUB_WORKSPACE}/tofu/uffis.tfvars" -out=tfplan

      - name: tofu apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: iac/tofu
        run: tofu apply -input=false tfplan

      - name: Provision + roll service
        if: ${{ inputs.action == 'apply' }}
        working-directory: iac/tofu
        run: |
          set -euo pipefail
          CLUSTER=$(tofu output -raw ecs_cluster)
          SERVICE=$(tofu output -raw service_name)
          PROVISION_TD=$(tofu output -raw provision_task_definition)
          WEB_TD=$(tofu output -raw web_task_definition)
          CNAME=$(tofu output -raw provision_container_name)
          SG=$(tofu output -raw web_security_group)
          SUBNETS=$(tofu output -json service_subnets | jq -r 'join(",")')
          PUB=$(tofu output -raw assign_public_ip)
          if [ "$PUB" = "true" ]; then PUBIP=ENABLED; else PUBIP=DISABLED; fi
          NETCFG="awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=$PUBIP}"

          echo "== run one-shot provision task =="
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$PROVISION_TD" \
            --launch-type FARGATE --network-configuration "$NETCFG" \
            --started-by "ci-provision" --query 'tasks[0].taskArn' --output text)
          [ -n "$TASK" ] && [ "$TASK" != "None" ] || { echo "::error::run-task returned no task ARN"; exit 1; }
          echo "provision task: $TASK"
          DEADLINE=$(( $(date +%s) + ${PROVISION_TIMEOUT:-1800} ))
          while [ "$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
                      --query 'tasks[0].lastStatus' --output text)" != "STOPPED" ]; do
            if [ "$(date +%s)" -gt "$DEADLINE" ]; then
              echo "::error::provision task still running after timeout; stopping it"
              aws ecs stop-task --cluster "$CLUSTER" --task "$TASK" --reason ci-timeout >/dev/null
              exit 1
            fi
            sleep 15
          done
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --query "tasks[0].containers[?name=='${CNAME}'].exitCode | [0]" --output text)
          echo "provision exit code: $CODE"
          if [ "$CODE" != "0" ]; then
            echo "::error::provision task did not succeed (exit ${CODE}); service NOT rolled."
            exit 1
          fi

          echo "== roll web service to the new task def =="
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$WEB_TD" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "deploy complete."
