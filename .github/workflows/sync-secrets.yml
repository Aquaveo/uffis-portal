name: sync secrets to SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  SSM_PREFIX: /uffis/portal

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Put SecureString parameters
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PS_CONNECTION: ${{ secrets.PS_CONNECTION }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: |
          set -euo pipefail
          put() {
            local name="${SSM_PREFIX}/$1" val="$2"
            if [ -z "$val" ]; then echo "::error::${name} has no GitHub secret set"; missing=1; return; fi
            aws ssm put-parameter --name "$name" --type SecureString --value "$val" --overwrite >/dev/null
            echo "put ${name}"
          }
          put db-password               "$DB_PASSWORD"
          put ps-connection             "$PS_CONNECTION"
          put secret-key                "$SECRET_KEY"
          put portal-superuser-password "$SUPERUSER_PASSWORD"
          [ -z "${missing:-}" ] || { echo "::error::the ECS task will fail to start"; exit 1; }
