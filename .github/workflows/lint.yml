name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Ruff
        run: uvx ruff check conf/

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck conf/portal-config.d/*.sh conf/init.d/*.sh

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.3"

      - name: Tofu fmt
        run: tofu fmt -check -recursive tofu-iam/ tofu-rds/

      - name: No account identifiers committed
        run: |
          set -euo pipefail
          if git grep -nE '\b[0-9]{12}\b|vpc-0[0-9a-f]{8,}|subnet-0[0-9a-f]{8,}' -- \
               ':!*.md' ':!.github/workflows/lint.yml' ; then
            echo "::error::an AWS account id, vpc or subnet leaked into a tracked file"
            exit 1
          fi
          echo "no account identifiers in tracked files"
